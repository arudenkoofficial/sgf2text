name: Deploy the converter page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it: a half-deployed
# page is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build:web

      # Publish only what the page needs. The sources stay in the repository
      # rather than being served alongside it.
      #
      # CNAME travels with the artifact so the published site carries the host it
      # is served on. This deployment is Actions-based, so the custom domain in
      # repository settings is what actually routes traffic and the file does not
      # control it — but shipping it keeps the artifact self-describing, and means
      # a switch back to branch-based publishing does not silently drop the domain.
      # The copies are enumerated rather than globbed, which is deliberate — but it
      # means a new kind of asset has to be named here or it simply never ships,
      # and it fails quietly: a missing font falls back to a system face and a
      # missing icon simply is not there, with nothing in the build to say so.
      #
      # `test/published-assets.test.ts` now reads this step and the document
      # together, so an asset referenced but not copied fails CI rather than the
      # live page. Adding a line here is still manual; forgetting one is not silent
      # any more.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp web/index.html _site/
          cp web/manifest.en.webmanifest _site/
          cp web/manifest.ru.webmanifest _site/
          cp CNAME _site/

          cp -R web/dist _site/dist
          cp -R web/fonts _site/fonts
          cp -R web/icons _site/icons

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
