name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Developed on the newest Node; 24 is the LTS the package promises to
        # support in `engines`. Running both keeps that promise tested rather
        # than asserted.
        node: ['24', '26']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # The library's tests run against its TypeScript sources directly, so a
      # construct Node cannot strip fails here rather than at someone's runtime.
      # The page's tests, and the ones reaching the package by name, run against the
      # built package, which `pretest` builds first.
      - run: npm test

      - run: npm run typecheck

      - run: npm run typecheck:web

      - run: npm run build

      - run: npm run build:web
