name: Publish the package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

# One release at a time. Two publishes racing for the same version would leave the
# second to fail at the registry after the first had already gone out.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The Node in .nvmrc ships npm 11.19, and trusted publishing needs 11.5.1 or
      # newer to authenticate with the workflow's identity token.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npm test

      - run: npm run build

      # The tag reaches the script through the environment rather than being pasted
      # into the command, so a release name can never be read by the shell as code.
      - run: node packages/sgf2text/scripts/check-release-tag.ts "$TAG"
        env:
          TAG: ${{ github.event.release.tag_name }}

      # No token: npm authenticates with the identity token requested above, which
      # works only once this repository is registered as the package's trusted
      # publisher on npmjs.
      - run: npm publish --workspace sgf2text --provenance
